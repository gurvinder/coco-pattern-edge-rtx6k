{{- if .Values.tools.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-public-tools
  labels:
    app: sidecar-public-tools
    coco.io/skip-initdata: "true"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    fsGroup: 1001
  containers:
    - name: server
      image: {{ .Values.image | quote }}
      command: [python3, -m, http.server, '8080', --directory, /srv]
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: '1', memory: 256Mi}
      volumeMounts:
        - {name: tools, mountPath: /srv}
  volumes:
    - name: tools
      emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: sidecar-public-tools
spec:
  selector: {app: sidecar-public-tools}
  ports:
    - {port: 8080, targetPort: 8080}
{{- end }}
