# AMD SEV-SNP + NVIDIA GPU passthrough on edge-rtx6k.
# OSC owns the runtime and guest driver. Keep the existing CPU runtime default.
clusterGroup:
  subscriptions:
    intel-device-plugins:
      disabled: true
    intel-tdx-dcap:
      disabled: true
    gpu-operator:
      name: gpu-operator-certified
      namespace: nvidia-gpu-operator
      # OCP 5.0.0-rc: sourced from the certified 4.22 index (see extraObjects below)
      # until the certified 5.0 index publishes gpu-operator-certified.
      source: coco-certified-v422
      sourceNamespace: openshift-marketplace
      channel: v26.3
      installPlanApproval: Manual
      csv: gpu-operator-certified.v26.3.0
      annotations:
        argocd.argoproj.io/sync-wave: "25"

  extraObjects:
    # OCP 5.0.0-rc: the certified 5.0 index does not yet publish the NVIDIA GPU
    # operator. Expose the certified 4.22 index so gpu-operator-certified installs.
    coco-certified-v422-catalog:
      apiVersion: operators.coreos.com/v1alpha1
      kind: CatalogSource
      metadata:
        name: coco-certified-v422
        namespace: openshift-marketplace
        annotations:
          argocd.argoproj.io/sync-wave: '1'
      spec:
        sourceType: grpc
        image: registry.redhat.io/redhat/certified-operator-index:v4.22
        displayName: CoCo Certified Operators (4.22 index)
        publisher: Red Hat
        updateStrategy:
          registryPoll:
            interval: 30m

  applications:
    qwen-chat:
      name: qwen-chat
      namespace: gpu-workload
      project: hub
      path: charts/coco-supported/qwen-chat
      extraValueFiles:
        - /overrides/values-qwen-chat.yaml
      annotations:
        argocd.argoproj.io/sync-wave: "35"
    encrypted-inference:
      name: encrypted-inference
      namespace: gpu-workload
      project: hub
      path: charts/coco-supported/encrypted-inference
      extraValueFiles:
        - /overrides/values-encrypted-qwen.yaml
      annotations:
        argocd.argoproj.io/sync-wave: "30"
    internal-registry:
      name: internal-registry
      namespace: openshift-image-registry
      project: hub
      path: charts/hub/internal-registry
      annotations:
        argocd.argoproj.io/sync-wave: "20"
    intel-dcap:
      disabled: true
    baremetal:
      overrides:
        - name: tdx.enabled
          value: "false"
    trustee:
      chart: null
      path: charts/hub/trustee-edge
      repoURL: git@github.com:pmatouse/coco-pattern-edge-rtx6k.git
      # Local copy matches released tag edge-trustee-0.10.3-1.
      # Argo cannot use two revisions of the same repo in a multisource app.
      chartVersion: null
      extraValueFiles:
        - /overrides/values-trustee.yaml
        - /overrides/values-snp-vcek.yaml
        - /overrides/values-trustee-gpu-model-keys.yaml
      # Helm replaces arrays; retain SNP and bare-metal reference loading.
      overrides:
        - name: kbs.snp.enabled
          value: "true"
        - name: kbs.baremetal.enabled
          value: "true"
        - name: kbs.gpu.enabled
          value: "true"
    nvidia-gpu:
      name: nvidia-gpu
      namespace: nvidia-gpu-operator
      project: hub
      path: charts/all/nvidia-gpu
      annotations:
        argocd.argoproj.io/sync-wave: "25"
      overrides:
        # IOMMU and ACS are already active; avoid an unnecessary SNO reboot.
        - name: iommu.enabled
          value: "false"
    gpu-workload:
      overrides:
        # Dedicate both GPUs to Qwen: original service plus RO/RW storage service.
        # Keep the standalone vector and encrypted-file demos disabled.
        - name: vectorAddReplicas
          value: "0"
        - name: encryptedFileTest.enabled
          value: "false"
      name: gpu-workload
      namespace: gpu-workload
      project: workloads
      path: charts/coco-supported/gpu-workload
      # One GPU per confidential VM; CPU and GPU references must be loaded first.
      disabled: false
      annotations:
        argocd.argoproj.io/sync-wave: "30"
