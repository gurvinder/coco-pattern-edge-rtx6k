clusterGroup:
  subscriptions:
    intel-device-plugins:
      disabled: true
    intel-tdx-dcap:
      disabled: true
    gpu-operator:
      name: gpu-operator-certified
      namespace: nvidia-gpu-operator
      source: certified-operators
      channel: v26.3
      installPlanApproval: Manual
      csv: gpu-operator-certified.v26.3.0
      annotations:
        argocd.argoproj.io/sync-wave: '25'
  applications:
    qwen-chat:
      name: qwen-chat
      namespace: gpu-workload
      project: hub
      path: charts/coco-supported/qwen-chat
      extraValueFiles:
      - /overrides/values-qwen-chat.yaml
      annotations:
        argocd.argoproj.io/sync-wave: '35'
      disabled: true
    encrypted-inference:
      name: encrypted-inference
      namespace: gpu-workload
      project: hub
      path: charts/coco-supported/encrypted-inference
      extraValueFiles:
      - /overrides/values-encrypted-qwen.yaml
      annotations:
        argocd.argoproj.io/sync-wave: '30'
      disabled: true
    internal-registry:
      name: internal-registry
      namespace: openshift-image-registry
      project: hub
      path: charts/hub/internal-registry
      annotations:
        argocd.argoproj.io/sync-wave: '20'
    intel-dcap:
      disabled: true
    baremetal:
      overrides:
      - name: tdx.enabled
        value: 'false'
    trustee:
      chart: null
      path: charts/hub/trustee-edge
      repoURL: https://github.com/pmatouse/coco-pattern-edge-rtx6k.git
      chartVersion: null
      extraValueFiles:
      - /overrides/values-trustee.yaml
      - /overrides/values-snp-vcek.yaml
      - /overrides/values-trustee-gpu-model-keys.yaml
      - /overrides/values-rhoai-qwen-trustee.yaml
      overrides:
      - name: kbs.snp.enabled
        value: 'true'
      - name: kbs.baremetal.enabled
        value: 'true'
      - name: kbs.gpu.enabled
        value: 'true'
    nvidia-gpu:
      name: nvidia-gpu
      namespace: nvidia-gpu-operator
      project: hub
      path: charts/all/nvidia-gpu
      annotations:
        argocd.argoproj.io/sync-wave: '25'
      overrides:
      - name: iommu.enabled
        value: 'false'
    gpu-workload:
      overrides:
      - name: vectorAddReplicas
        value: '0'
      - name: encryptedFileTest.enabled
        value: 'false'
      name: gpu-workload
      namespace: gpu-workload
      project: workloads
      path: charts/coco-supported/gpu-workload
      disabled: false
      annotations:
        argocd.argoproj.io/sync-wave: '30'
    kserve:
      disabled: true
    kserve-crd:
      disabled: true
    confidential-inference:
      disabled: true
    hello-openshift:
      disabled: true
    kbs-access-curl:
      disabled: true
    kbs-access-sealed:
      disabled: true
    rhoai-platform:
      name: rhoai-platform
      namespace: redhat-ods-operator
      project: hub
      repoURL: https://github.com/pmatouse/confidential-inference-pattern.git
      path: charts/rhoai-platform
      chartVersion: rhoai-confidential-qwen
      extraValueFiles:
      - /overrides/values-rhoai-platform.yaml
      annotations:
        argocd.argoproj.io/sync-wave: '30'
      disabled: false
    rhoai-model-publisher:
      name: rhoai-model-publisher
      namespace: rhoai-model-publisher
      project: hub
      repoURL: https://github.com/pmatouse/confidential-inference-pattern.git
      path: charts/rhoai-model-publisher
      chartVersion: rhoai-confidential-qwen
      extraValueFiles:
      - /overrides/values-rhoai-publisher.yaml
      annotations:
        argocd.argoproj.io/sync-wave: '32'
      disabled: false
    rhoai-confidential-qwen:
      name: rhoai-confidential-qwen
      namespace: rhoai-confidential-qwen
      project: hub
      repoURL: https://github.com/pmatouse/confidential-inference-pattern.git
      path: charts/rhoai-confidential-qwen
      chartVersion: rhoai-confidential-qwen
      extraValueFiles:
      - /overrides/values-rhoai-qwen.yaml
      annotations:
        argocd.argoproj.io/sync-wave: '40'
      disabled: false
