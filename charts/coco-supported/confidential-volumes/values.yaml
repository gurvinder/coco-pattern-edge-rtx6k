# Schema is always rendered. The controller is opt-in and namespace scoped.
controller:
  enabled: false
  image: ""
  clusterId: ""
  intervalSeconds: 15
  includeStandalonePods: false
  # Explicit KServe target names this controller may deploy. Empty = publication only.
  sidecarWorkloads: []
  # Ed25519 public keys only. An empty keyring permits request generation only.
  approvalKeys: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
openshift:
  buildEnabled: false
